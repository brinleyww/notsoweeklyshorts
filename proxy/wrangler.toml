# Deploy from this directory:  npx wrangler deploy
name = "pt-leaderboard-proxy"
main = "src/worker.js"
compatibility_date = "2026-07-01"

[observability]
enabled = true

[observability.logs]
# Invocation logs record every request URL, and leaderboard reads carry the
# player's userToken in the query string. Keep them off.
invocation_logs = false

[vars]
UPSTREAM = "https://vps.kodub.com"
UPSTREAM_ORIGIN = "https://www.kodub.com"

# Scheme + host, no path. Every other site gets 403, so every address the site
# is served from must be here or its leaderboards fail to load.
ALLOWED_ORIGINS = ["https://brinleyww.github.io", "https://notweeklyshorts.github.io"]

# Not case-sensitive. Ranks and player counts are recounted without them.
BANNED_NICKNAMES = ["WebMaster", "PWABHRRSTAL", "Awrah", "CookedByaTAS"]

# The week in progress: other players' times and recordings on it (and on any
# later week) stay secret. Bump it whenever a new week goes live.
CURRENT_WEEK = 9

# Author Time players, whose times stay visible during the week. Keep in step
# with BENCHMARK_NICKNAME and the BENCHMARK_NICKNAME_*_OVERRIDES in main.bundle.js.
PUBLIC_NICKNAMES = ["Cookedbyapringle", "CookedbyBenjamin's 5th cousin", "JonnieJeans"]

# First week stored on Kodub under a secret track id (needs the TRACK_SALT
# secret). Never raise it, change TRACK_SALT or renumber weeks once runs exist:
# runs stored under the old ids would stop showing.
HIDDEN_FROM_WEEK = 7

# The owner, and nobody else, gets past every restriction: sees every run on the week
# in progress in full, uses the proxy from any site or tool, skips the anti-cheat, and
# opens the traffic dashboard. Each entry is sha256("nsws-owner:" + private token),
# never the token itself:
#   node -e "console.log(require('crypto').createHash('sha256').update('nsws-owner:' + process.argv[1]).digest('hex'))" <token>
OWNER_KEY_HASHES = ["965911be14a967812d548ebc4dd604e6d1a16601ffa26dc995532628fd0b6a6a"]

# The owner's public userId (plain sha256 of the token, the same id every leaderboard
# entry shows). Runs by this account always show, wherever they were uploaded from;
# only the owner's key can create runs under it.
OWNER_USER_IDS = ["ab5cf70f37b29f3c54305072e863ef1dd9d78abe490f850afe9050535d7d47a8"]

# init.bin (the game's physics meshes for the anti-cheat) is imported as an ArrayBuffer.
[[rules]]
type = "Data"
globs = ["**/*.bin"]
fallthrough = true

# Site traffic for the owner dashboard (src/traffic.js).
[[durable_objects.bindings]]
name = "TRAFFIC"
class_name = "TrafficStats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TrafficStats"]

# Anti-cheat (src/anticheat.js): verdicts and synced tracks, and the physics replays.
[[durable_objects.bindings]]
name = "ANTICHEAT"
class_name = "AntiCheat"

[[durable_objects.bindings]]
name = "RUN_CHECKER"
class_name = "RunChecker"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AntiCheat", "RunChecker"]

# The universal chat (src/chat.js): every player's WebSocket and the last messages.
[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatRoom"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ChatRoom"]

# Accounts (src/accounts.js): who holds each nickname, every account's clips, and shared clip links.
[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Accounts"]
